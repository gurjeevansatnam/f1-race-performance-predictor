name: Live prediction

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours, 17 mins past (github's busy on the hour)
  workflow_dispatch:         # so i can run it manually from the actions tab

permissions:
  contents: write            # needs this to commit the new prediction

concurrency:
  group: live-prediction     # don't run two at the same time

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Get latest results
        run: python src/data/update_data.py

      - name: Update readme prediction
        run: python src/update_readme.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md results data
          git diff --cached --quiet || (git commit -m "Update live prediction" && git push)


          